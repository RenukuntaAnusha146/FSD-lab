<!DOCTYPE html>
<html>
<head>
    <title>First program</title>
</head>
<body>

    <b>The text is bold.</b><br>
    <strong>This text is important!</strong>.<br>
    <i>This text is italic</i><br>
    <em>This text is emphasized</em><br>
    <small>This is some smaller text</small>

    <!-- The 'style' attribute forces the browser to paint the text color -->
    <p style="color:red;">Do not forget to buy <mark>milk</mark> today.</p>
    
    <p style="color:blue;">My favorite color is <del>blue</del> red.</p>
    
    <p style="color:green;">My favorite color is <del>blue</del> <ins>red</ins>.</p>
    
    <p style="color:purple;">This is <sub>subscripted</sub> text.</p>
    
    <!-- Changed from yellow to darkorange so it is visible on your screen -->
    <p style="color:darkorange;">This is <sup>superscripted</sup> text.</p>

</body>
</html>
